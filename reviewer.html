            --primary-light: #93c5fd;

        }

        * {

            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border);
        }

        h1 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 2rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .controls {
            position: sticky;
            top: 15px;
            z-index: 100;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: var(--bg);
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
        }

        .btn {
            background-color: var(--primary-light);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-toggle {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .part-header {
            background: var(--primary);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            margin: 30px 0 15px 0;
            font-size: 1.25rem;
        }

        .qa-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
        }

        .q-number {
            font-weight: 700;
            color: var(--primary-light);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .question {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .answer {
            background-color: var(--accent-green-bg);
            color: var(--accent-green);
            padding: 10px 14px;
            border-radius: 6px;
            font-weight: 600;
            margin-bottom: 12px;
            border-left: 4px solid var(--accent-green);
        }

        .explanation {
            background-color: var(--accent-blue-bg);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
            border-left: 4px solid var(--primary-light);
        }

        .explanation-title {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--primary-light);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .controls { flex-direction: column; align-items: stretch; }
            .btn { width: 100%; }
        }
    </style>
</head>

function renderContent() {
    const container = document.getElementById('reviewerContent');
    let currentPart = "";

    qaData.forEach((item, index) => {
        if (item.part !== currentPart) {
            currentPart = item.part;
            const partEl = document.createElement('h2');
            partEl.className = 'part-header';
            partEl.innerText = currentPart;
            container.appendChild(partEl);
        }

        const card = document.createElement('div');
        card.className = 'qa-card';
        card.innerHTML = `
            <div class="q-number">Question ${index + 1}</div>
            <div class="question">Q: ${item.q}</div>
            <div class="answer">A: ${item.a}</div>
            <div class="explanation">
                <div class="explanation-title">Explanation</div>
                ${item.exp}
            </div>
        `;
        container.appendChild(card);
    });
}

function filterCards() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const cards = document.querySelectorAll('.qa-card');
    
    cards.forEach(card => {
        const text = card.innerText.toLowerCase();
        if (text.includes(query)) {
            card.classList.remove('hidden');
        } else {
            card.classList.add('hidden');
        }
    });

    const partHeaders = document.querySelectorAll('.part-header');
    partHeaders.forEach(header => {
        let nextEl = header.nextElementSibling;
        let hasVisible = false;
        while (nextEl && !nextEl.classList.contains('part-header')) {
            if (nextEl.classList.contains('qa-card') && !nextEl.classList.contains('hidden')) {
                hasVisible = true;
                break;
            }
            nextEl = nextEl.nextElementSibling;
        }
        if (hasVisible || query === "") {
            header.classList.remove('hidden');
        } else {
            header.classList.add('hidden');
        }
    });
}

function toggleAnswers() {
    const answers = document.querySelectorAll('.answer');
    answers.forEach(a => a.classList.toggle('hidden'));
}

function toggleExplanations() {
    const explanations = document.querySelectorAll('.explanation');
    explanations.forEach(e => e.classList.toggle('hidden'));
}

function toggleTheme() {
    const currentTheme = document.body.getAttribute('data-theme');
    if (currentTheme === 'dark') {
        document.body.removeAttribute('data-theme');
    } else {
        document.body.setAttribute('data-theme', 'dark');
    }
}

window.onload = renderContent;
