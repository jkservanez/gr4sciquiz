function shuffleArray(array) {
    const shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

function getRandomQuestions(category, count) {
    const coverageKey = 'quizCoverage_' + category;
    let deck = [];

    try {
        deck = JSON.parse(localStorage.getItem(coverageKey) || '[]');
    } catch (e) {
        deck = [];
    }

    const maxIndex = questionBank[category].length - 1;

    deck = [...new Set(
        deck.filter(i => Number.isInteger(i) && i >= 0 && i <= maxIndex)
    )];

    const used = new Set(deck);
    const available = questionBank[category]
        .map((_, i) => i)
        .filter(i => !used.has(i));

    if (available.length < count) {
        deck = shuffleArray(questionBank[category].map((_, i) => i));
    } else if (deck.length < count) {
        deck = [...deck, ...shuffleArray(available)];
    }

    const selectedIndexes = deck.slice(0, count);
    deck = deck.slice(count);
    localStorage.setItem(coverageKey, JSON.stringify(deck));

    return selectedIndexes.map(i => {
        const q = questionBank[category][i];
        if (q.options) {
            return {
                ...q,
                options: shuffleArray(q.options),
                category
            };
        }
        return { ...q, category };
    });
}

function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

function startQuiz() {
    timerMode = document.getElementById('timerModeSelect').value;
    const quizType = document.getElementById('quizTypeSelect').value;
    
    let easyQs = [];
    let mediumQs = [];
    let hardQs = [];

    if (quizType === 'both') {
        easyQs = getRandomQuestions('easy', 20);
        mediumQs = getRandomQuestions('medium', 20);
        hardQs = getRandomQuestions('hard', 10);
    } else if (quizType === 'mcq') {
        easyQs = getRandomQuestions('easy', 20);
        mediumQs = getRandomQuestions('medium', 20);
    } else if (quizType === 'fitb') {
        hardQs = getRandomQuestions('hard', 10);
    }

    currentQuizQuestions = [...easyQs, ...mediumQs, ...hardQs];
    currentQuestionIndex = 0;
    userAnswers = [];
    scores = { easy: 0, medium: 0, hard: 0 };
    timeSpentTotal = 0;

    clearInterval(timerInterval);
    const timerContainer = document.getElementById('timerContainer');
    
    if (timerMode === 'none') {
        timerContainer.classList.add('hidden');
    } else {
        timerContainer.classList.remove('hidden');
        if (timerMode === 'overall') {
            timeRemaining = parseInt(document.getElementById('overallTimeSelect').value, 10);
        } else if (timerMode === 'perQuestion') {
            perQuestionTimeLimit = parseInt(document.getElementById('perQuestionTimeSelect').value, 10);
            timeRemaining = perQuestionTimeLimit;
        }
    }

    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('resultsScreen').classList.add('hidden');
    document.getElementById('quizScreen').classList.remove('hidden');

    showQuestion();
    startTimer();
}

function startTimer() {
    if (timerMode === 'none') return;

    updateTimerDisplay();

    timerInterval = setInterval(() => {
        timeRemaining--;
        timeSpentTotal++;

        updateTimerDisplay();

        if (timeRemaining <= 0) {
            if (timerMode === 'overall') {
                clearInterval(timerInterval);
                autoSubmitRemaining();
                showResults(true);
            } else if (timerMode === 'perQuestion') {
                saveAnswer("", true);
            }
        }
    }, 1000);
}

function updateTimerDisplay() {
    const timerText = document.getElementById('timerText');
    const timerContainer = document.getElementById('timerContainer');
    
    timerText.innerText = formatTime(timeRemaining);

    timerContainer.classList.remove('warn', 'danger');
    if (timerMode === 'overall') {
        if (timeRemaining <= 60) timerContainer.classList.add('danger');
        else if (timeRemaining <= 180) timerContainer.classList.add('warn');
    } else if (timerMode === 'perQuestion') {
        if (timeRemaining <= 5) timerContainer.classList.add('danger');
        else if (timeRemaining <= 10) timerContainer.classList.add('warn');
    }
}

function showQuestion() {
    const q = currentQuizQuestions[currentQuestionIndex];
    const totalQs = currentQuizQuestions.length;

    if (timerMode === 'perQuestion') {
        timeRemaining = perQuestionTimeLimit;
        updateTimerDisplay();
    }
    
    document.getElementById('progressText').innerText = `Question ${currentQuestionIndex + 1} of ${totalQs}`;
    document.getElementById('progressBar').style.width = `${((currentQuestionIndex + 1) / totalQs) * 100}%`;

    const badge = document.getElementById('roundBadge');
    if (q.category === 'easy') {
        badge.innerText = "Easy Round";
        badge.className = "round-badge badge-easy";
    } else if (q.category === 'medium') {
        badge.innerText = "Medium Round";
        badge.className = "round-badge badge-medium";
    } else {
        badge.innerText = "Hard Round (Fill-in)";
        badge.className = "round-badge badge-hard";
    }

    document.getElementById('questionText').innerText = q.q;

    const mcContainer = document.getElementById('mcContainer');
    const fitbContainer = document.getElementById('fitbContainer');
    const fitbInput = document.getElementById('fitbInput');

    if (q.category === 'easy' || q.category === 'medium') {
        mcContainer.classList.remove('hidden');
        fitbContainer.classList.add('hidden');
        mcContainer.innerHTML = '';

        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(opt);
            mcContainer.appendChild(btn);
        });
    } else {
        mcContainer.classList.add('hidden');
        fitbContainer.classList.remove('hidden');
        fitbInput.value = '';
        fitbInput.focus();
    }
}

function selectOption(selectedOpt) {
    saveAnswer(selectedOpt);
}

function handleNext() {
    const q = currentQuizQuestions[currentQuestionIndex];
    if (q.category === 'hard') {
        const inputVal = document.getElementById('fitbInput').value.trim();
        saveAnswer(inputVal);
    }
}

function saveAnswer(answer, isTimeOut = false) {
    const q = currentQuizQuestions[currentQuestionIndex];
    let isCorrect = false;

    if (!isTimeOut && answer !== "") {
        const normalize = (str) => String(str || "").toLowerCase().replace(/[^a-z0-9]/g, "").trim();
        const validAnswers = Array.isArray(q.a) ? q.a : [q.a];
        isCorrect = validAnswers.some(target => normalize(answer) === normalize(target));
    }

    if (isCorrect) {
        scores[q.category]++;
    }

    userAnswers.push({
        question: q.q,
        userAns: isTimeOut ? "⏰ (Time Expired)" : (answer || "(No Answer)"),
        correctAns: Array.isArray(q.a) ? q.a[0] : q.a,
        explanation: q.exp || "",
        isCorrect: isCorrect,
        category: q.category
    });

    currentQuestionIndex++;

    if (currentQuestionIndex < currentQuizQuestions.length) {
        showQuestion();
    } else {
        clearInterval(timerInterval);
        showResults();
    }
}

function autoSubmitRemaining() {
    while (currentQuestionIndex < currentQuizQuestions.length) {
        const q = currentQuizQuestions[currentQuestionIndex];
        userAnswers.push({
            question: q.q,
            userAns: "⏰ (Time Expired)",
            correctAns: Array.isArray(q.a) ? q.a[0] : q.a,
            explanation: q.exp || "",
            isCorrect: false,
            category: q.category
        });
        currentQuestionIndex++;
    }
}

function showResults(timeOutOccurred = false) {
    clearInterval(timerInterval);
    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('resultsScreen').classList.remove('hidden');

    const totalQuestions = currentQuizQuestions.length;
    const totalCorrect = scores.easy + scores.medium + scores.hard;
    const percentage = Math.round((totalCorrect / totalQuestions) * 100);

    document.getElementById('finalScore').innerText = `${totalCorrect}/${totalQuestions}`;
    document.getElementById('finalPercent').innerText = `${percentage}%`;

    const breakdownGrid = document.getElementById('breakdownGrid');
    breakdownGrid.innerHTML = '';

    const quizType = document.getElementById('quizTypeSelect').value;
    if (quizType === 'both' || quizType === 'mcq') {
        breakdownGrid.innerHTML += `
            <div class="breakdown-card">
                <h4>Easy</h4>
                <p>${scores.easy}/20</p>
            </div>
            <div class="breakdown-card">
                <h4>Medium</h4>
                <p>${scores.medium}/20</p>
            </div>
        `;
    }
    if (quizType === 'both' || quizType === 'fitb') {
        breakdownGrid.innerHTML += `
            <div class="breakdown-card">
                <h4>Hard</h4>
                <p>${scores.hard}/10</p>
            </div>
        `;
    }

    const msg = document.getElementById('scoreMessage');
    if (timeOutOccurred) {
        msg.innerText = "⏳ Time's Up! Here is how you scored before time ran out:";
    } else if (percentage >= 90) msg.innerText = "Outstanding performance! Mastery achieved!";
    else if (percentage >= 75) msg.innerText = "Great job! Strong science knowledge!";
    else if (percentage >= 50) msg.innerText = "Good effort! Keep reviewing to improve!";
    else msg.innerText = "Needs practice. Try reviewing the concepts again!";

    const timeSpentText = document.getElementById('timeSpentText');
    if (timerMode !== 'none') {
        timeSpentText.innerText = `Total Time Elapsed: ${formatTime(timeSpentTotal)}`;
    } else {
        timeSpentText.innerText = "";
    }

    const reviewContainer = document.getElementById('reviewContainer');
    reviewContainer.innerHTML = '';

    userAnswers.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = `review-item ${item.isCorrect ? 'correct' : 'incorrect'}`;
        div.innerHTML = `
            <div class="review-q">${idx + 1}. ${item.question}</div>
            <div class="review-ans">
                <strong>Your Answer:</strong> ${item.userAns} <br>
                ${!item.isCorrect ? `<strong>Correct Answer:</strong> ${item.correctAns}<br>` : ''}
                <div class="review-explanation"><strong>Why:</strong> ${item.explanation}</div>
            </div>
        `;
        reviewContainer.appendChild(div);
    });
}

function toggleTheme() {
    const currentTheme = document.body.getAttribute('data-theme');
    if (currentTheme === 'dark') {
        document.body.removeAttribute('data-theme');
    } else {
        document.body.setAttribute('data-theme', 'dark');
    }
}

    }
});

// Ensure controls are synced on load
toggleTimerInputs();
